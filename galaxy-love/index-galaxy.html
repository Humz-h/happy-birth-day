<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Galaxy Love 💜</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      cursor: default;
    }
    canvas {
      display: block;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    .image-label {
      user-select: none;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      font-weight: 500;
      max-width: 300px;
      backdrop-filter: blur(10px);
      animation: fadeIn 0.5s ease-in;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Modal overlay */
    .image-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(3px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }
    
    .image-modal.active {
      display: flex;
      opacity: 1;
    }
    
    .modal-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      animation: modalFadeIn 0.6s ease-out;
    }
    
    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: scale(0.8) translateY(30px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    
    .modal-image {
      max-width: 100%;
      max-height: 70vh;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(255, 192, 203, 0.6);
      border: 3px solid rgba(255, 105, 180, 0.5);
    }
    
    .modal-message {
      color: #ffffff;
      font-size: 20px;
      font-family: '"Segoe UI", Arial, sans-serif';
      text-align: center;
      background: linear-gradient(135deg, rgba(255, 105, 180, 0.9) 0%, rgba(255, 20, 147, 0.9) 100%);
      padding: 16px 24px;
      border-radius: 12px;
      border: 2px solid rgba(255, 192, 203, 0.5);
      box-shadow: 0 4px 15px rgba(255, 105, 180, 0.6);
      max-width: 600px;
      line-height: 1.6;
      min-height: 60px;
    }
    
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  
  <!-- Modal để hiển thị ảnh -->
  <div id="imageModal" class="image-modal">
    <div class="modal-content">
      <img id="modalImage" class="modal-image" src="" alt="Ảnh tình yêu">
      <div id="modalMessage" class="modal-message"></div>
    </div>
  </div>
  
  <!-- Audio for galaxy page (autoplay) -->
  <audio id="galaxy-music" src="../assets/nhạc galaxy.m4a" loop playsinline preload="auto"></audio>

  <script type="module" src="main.js"></script>
</body>
</html>
